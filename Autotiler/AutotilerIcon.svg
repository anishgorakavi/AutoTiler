<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="background" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17233D"/>
      <stop offset="1" stop-color="#0B1224"/>
    </linearGradient>
    <linearGradient id="teal" x1="90" y1="96" x2="282" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65E6D1"/>
      <stop offset="1" stop-color="#18AFAF"/>
    </linearGradient>
    <linearGradient id="orange" x1="304" y1="98" x2="422" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCC7A"/>
      <stop offset="1" stop-color="#F47B55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#background)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="4"/>

  <!-- A compact window layout: two stacked tiles beside a larger master tile. -->
  <g filter="url(#shadow)">
    <rect x="78" y="78" width="200" height="356" rx="38" fill="url(#teal)"/>
    <rect x="306" y="78" width="128" height="164" rx="34" fill="url(#orange)"/>
    <rect x="306" y="270" width="128" height="164" rx="34" fill="#8A79E8"/>
  </g>

  <path d="M114 132h128" stroke="#E7FFFA" stroke-opacity="0.62" stroke-width="14" stroke-linecap="round"/>
  <path d="M342 132h56M342 324h56" stroke="#FFF5E1" stroke-opacity="0.7" stroke-width="12" stroke-linecap="round"/>
  <circle cx="390" cy="202" r="8" fill="#FFF5E1" fill-opacity="0.72"/>
  <circle cx="390" cy="394" r="8" fill="#F0EDFF" fill-opacity="0.72"/>
</svg>
